[package]
name    = "loony-s3"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "loony-s3"
path = "src/main.rs"

[dependencies]
# ── Web ──────────────────────────────────────────────────────────────────────
axum          = { version = "0.7", features = ["multipart"] }
tokio         = { version = "1",   features = ["full"] }
tower         = "0.4"
tower-http    = { version = "0.5", features = ["trace", "request-id", "sensitive-headers"] }
http          = "1"

# ── Database ──────────────────────────────────────────────────────────────────
sqlx = { version = "0.7", features = [
  "runtime-tokio-native-tls", "sqlite", "postgres",
  "chrono", "json", "uuid",
] }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── Types ────────────────────────────────────────────────────────────────────
uuid    = { version = "1", features = ["v4"] }
chrono  = { version = "0.4", features = ["serde"] }
bytes   = "1"

# ── Async utils ───────────────────────────────────────────────────────────────
futures-util  = "0.3"
tokio-util    = { version = "0.7", features = ["io"] }
async-trait   = "0.1"

# ── Auth / Crypto ─────────────────────────────────────────────────────────────
jsonwebtoken  = "9"
hmac          = "0.12"
sha2          = "0.10"
md-5          = "0.10"
digest        = "0.10"
hex           = "0.4"
base64        = "0.22"
subtle        = "2"               # constant-time comparison

# ── MIME ──────────────────────────────────────────────────────────────────────
mime_guess = "2"

# ── Logging ───────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Errors ────────────────────────────────────────────────────────────────────
thiserror = "1"

# ── Rate limiting ─────────────────────────────────────────────────────────────
governor = { version = "0.6", features = ["dashmap"] }

# ── Config ────────────────────────────────────────────────────────────────────
dotenvy = "0.15"
