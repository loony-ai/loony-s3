worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS so nginx re-resolves "app" after container
    # restarts and correctly discovers all replicas when scaled.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream loony_s3 {
        # Docker Compose round-robins across all replicas of the "app" service.
        server app:3000;
        keepalive 32;
    }

    # Hide server version from responses.
    server_tokens off;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time s '
                    '"$request" $status $body_bytes_sent '
                    '"$http_x_request_id"';
    access_log /var/log/nginx/access.log main;

    # ── Upload size limit (must match app config MAX_OBJECT_SIZE_BYTES) ──────
    client_max_body_size 5g;

    server {
        listen 80;

        # Forward the real client IP so express trust-proxy works.
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host            $host;

        # Propagate or generate a request ID for end-to-end tracing.
        proxy_set_header X-Request-ID    $request_id;

        # ── Timeouts ─────────────────────────────────────────────────────────
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;   # allow large uploads to stream fully
        proxy_read_timeout    300s;

        # ── Disable buffering for streaming uploads and downloads ─────────────
        # With buffering on, nginx would hold the entire body in memory/disk
        # before forwarding — unacceptable for multi-GB objects.
        proxy_buffering             off;
        proxy_request_buffering     off;

        # ── Health check endpoint (bypass rate limit, handled by nginx) ───────
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── All other traffic → app ───────────────────────────────────────────
        location / {
            set $upstream app:3000;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # keep-alive to upstream
        }
    }
}
